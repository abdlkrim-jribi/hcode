[package]
name = "hcode-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
keyring = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "hcode-desktop"
path = "src/main.rs"
