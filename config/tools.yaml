# Hcode Tool Definitions
# Based on exact Claude Code tool specifications
# These definitions control how tools are presented to the AI

tools:
  # ==========================================================================
  # FILE OPERATIONS
  # ==========================================================================

  Read:
    name: "Read"
    description: |
      Reads a file from the local filesystem. The file_path parameter must be an absolute path, not a relative path. By default, it reads up to 2000 lines starting from the beginning of the file. You can optionally specify a line offset and limit (especially handy for long files), but it's recommended to read the whole file by not providing these parameters. Any lines longer than 2000 characters will be truncated. For image files, the tool will display the image for you. For Jupyter notebooks (.ipynb files), use the NotebookRead tool instead.
    parameters:
      file_path:
        type: string
        description: "The path to the file to read (relative to project root preferred)"
        required: true
      offset:
        type: integer
        description: "The line number to start reading from. Only provide if the file is too large to read at once"
        required: false
      limit:
        type: integer
        description: "The number of lines to read. Only provide if the file is too large to read at once"
        required: false

  Write:
    name: "Write"
    description: |
      Write a file to the local filesystem. Overwrites the existing file if there is one.

      Before using this tool:

      1. Use the Read tool to understand the file's contents and context

      2. Directory Verification (only applicable when creating new files):
         - Use the LS tool to verify the parent directory exists and is the correct location
    parameters:
      file_path:
        type: string
        description: "The path to the file to write (relative to project root preferred)"
        required: true
      content:
        type: string
        description: "The content to write to the file"
        required: true

  Edit:
    name: "Edit"
    description: |
      This is a tool for editing files. For moving or renaming files, you should generally use the Bash tool with the 'mv' command instead. For larger edits, use the Write tool to overwrite files. For Jupyter notebooks (.ipynb files), use the NotebookEdit tool instead.

      Before using this tool:

      1. Use the Read tool to understand the file's contents and context

      2. Verify the directory path is correct (only applicable when creating new files):
         - Use the LS tool to verify the parent directory exists and is the correct location

      To make a file edit, provide the following:
      1. file_path: The absolute path to the file to modify (must be absolute, not relative)
      2. old_string: The text to replace (must be unique within the file, and must match the file contents exactly, including all whitespace and indentation)
      3. new_string: The edited text to replace the old_string

      The tool will replace ONE occurrence of old_string with new_string in the specified file.

      CRITICAL REQUIREMENTS FOR USING THIS TOOL:

      1. UNIQUENESS: The old_string MUST uniquely identify the specific instance you want to change. This means:
         - Include AT LEAST 3-5 lines of context BEFORE the change point
         - Include AT LEAST 3-5 lines of context AFTER the change point
         - Include all whitespace, indentation, and surrounding code exactly as it appears in the file

      2. SINGLE INSTANCE: This tool can only change ONE instance at a time. If you need to change multiple instances:
         - Make separate calls to this tool for each instance
         - Each call must uniquely identify its specific instance using extensive context

      3. VERIFICATION: Before using this tool:
         - Check how many instances of the target text exist in the file
         - If multiple instances exist, gather enough context to uniquely identify each one
         - Plan separate tool calls for each instance

      WARNING: If you do not follow these requirements:
         - The tool will fail if old_string matches multiple locations
         - The tool will fail if old_string doesn't match exactly (including whitespace)
         - You may change the wrong instance if you don't include enough context

      When making edits:
         - Ensure the edit results in idiomatic, correct code
         - Do not leave the code in a broken state
         - Always use absolute file paths (starting with /)

      If you want to create a new file, use:
         - A new file path, including dir name if needed
         - An empty old_string
         - The new file's contents as new_string

      Remember: when making multiple file edits in a row to the same file, you should prefer to send all edits in a single message with multiple calls to this tool, rather than multiple messages with a single call each.
    parameters:
      file_path:
        type: string
        description: "The path to the file to modify (relative to project root preferred)"
        required: true
      old_string:
        type: string
        description: "The text to replace"
        required: true
      new_string:
        type: string
        description: "The edited text to replace the old_string"
        required: true

  # ==========================================================================
  # SEARCH OPERATIONS
  # ==========================================================================

  Glob:
    name: "Glob"
    description: |
      - Fast file pattern matching tool that works with any codebase size
      - Supports glob patterns like "**/*.js" or "src/**/*.ts"
      - Returns matching file paths sorted by modification time
      - Use this tool when you need to find files by name patterns
      - When you are doing an open ended search that may require multiple rounds of globbing and grepping, use the Task tool instead
    parameters:
      pattern:
        type: string
        description: "The glob pattern to match files against"
        required: true
      path:
        type: string
        description: "The directory to search in. Defaults to current working directory."
        required: false

  Grep:
    name: "Grep"
    description: |
      - Fast content search tool that works with any codebase size
      - Searches file contents using regular expressions
      - Supports full regex syntax (eg. "log.*Error", "function\\s+\\w+", etc.)
      - Filter files by pattern with the include parameter (eg. "*.js", "*.{ts,tsx}")
      - Returns matching file paths sorted by modification time
      - Use this tool when you need to find files containing specific patterns
      - When you are doing an open ended search that may require multiple rounds of globbing and grepping, use the Task tool instead
    parameters:
      pattern:
        type: string
        description: "The regular expression pattern to search for in file contents"
        required: true
      path:
        type: string
        description: "The directory to search in. Defaults to current working directory."
        required: false
      include:
        type: string
        description: "File pattern to include (eg. \"*.js\", \"*.{ts,tsx}\")"
        required: false

  LS:
    name: "LS"
    description: |
      Lists files and directories in a given path. The path parameter must be an absolute path, not a relative path. You should generally prefer the Glob and Grep tools, if you know which directories to search.
    parameters:
      path:
        type: string
        description: "The path to the directory to list (relative to project root preferred)"
        required: true

  # ==========================================================================
  # COMMAND EXECUTION
  # ==========================================================================

  Bash:
    name: "Bash"
    description: |
      Executes a given bash command in a persistent shell session with optional timeout, ensuring proper handling and security measures.

      Before executing the command, please follow these steps:

      1. Directory Verification:
         - If the command will create new directories or files, first use the LS tool to verify the parent directory exists and is the correct location
         - For example, before running "mkdir foo/bar", first use LS to check that "foo" exists and is the intended parent directory

      2. Security Check:
         - For security and to limit the threat of a prompt injection attack, some commands are limited or banned. If you use a disallowed command, you will receive an error message explaining the restriction. Explain the error to the User.
         - Verify that the command is not one of the banned commands.

      3. Command Execution:
         - After ensuring proper quoting, execute the command.
         - Capture the output of the command.

      Usage notes:
        - The command argument is required.
        - You can specify an optional timeout in milliseconds (up to 600000ms / 10 minutes). If not specified, commands will timeout after 30 minutes.
        - VERY IMPORTANT: You MUST avoid using search commands like `find` and `grep`. Instead use Grep, Glob, or Task tool to search. You MUST avoid read tools like `cat`, `head`, `tail`, and `ls`, and use Read and LS to read files.
        - When issuing multiple commands, use the ';' or '&&' operator to separate them. DO NOT use newlines (newlines are ok in quoted strings).
        - IMPORTANT: All commands share the same shell session. Shell state (environment variables, virtual environments, current directory, etc.) persist between commands.
        - Try to maintain your current working directory throughout the session by using absolute paths and avoiding usage of `cd`. You may use `cd` if the User explicitly requests it.
    parameters:
      command:
        type: string
        description: "The bash command to execute"
        required: true
      timeout:
        type: integer
        description: "Optional timeout in milliseconds (max 600000)"
        required: false
      description:
        type: string
        description: "Clear, concise description of what this command does in 5-10 words"
        required: false

  # ==========================================================================
  # THINKING & REASONING
  # ==========================================================================

  Think:
    name: "Think"
    description: |
      Use the tool to think about something. It will not obtain new information or make any changes to the repository, but just log the thought. Use it when complex reasoning or brainstorming is needed.

      Common use cases:
      1. When exploring a repository and discovering the source of a bug, call this tool to brainstorm several unique ways of fixing the bug, and assess which change(s) are likely to be simplest and most effective
      2. After receiving test results, use this tool to brainstorm ways to fix failing tests
      3. When planning a complex refactoring, use this tool to outline different approaches and their tradeoffs
      4. When designing a new feature, use this tool to think through architecture decisions and implementation details
      5. When debugging a complex issue, use this tool to organize your thoughts and hypotheses

      The tool simply logs your thought process for better transparency and does not execute any code or make changes.
    parameters:
      thought:
        type: string
        description: "Your thought or reasoning process"
        required: true

  # ==========================================================================
  # TASK MANAGEMENT
  # ==========================================================================



  # ==========================================================================
  # USER INTERACTION
  # ==========================================================================

  AskUser:
    name: "AskUser"
    description: |
      Use this tool when you need to ask the user questions during execution. This allows you to:
      1. Gather user preferences or requirements
      2. Clarify ambiguous instructions
      3. Get decisions on implementation choices as you work
      4. Offer choices to the user about what direction to take
    parameters:
      question:
        type: string
        description: "The question to ask the user"
        required: true
      options:
        type: array
        description: "Optional list of choices for the user"
        required: false

  TodoWrite:
    name: "TodoWrite"
    description: |
      Manage todo lists for tracking task progress. Use this to update the user on your progress.
      
      The 'todos' parameter is a list of objects, where each object has:
      - content: The task description
      - status: 'pending', 'in_progress', or 'completed'
      - activeForm: A short present-tense action phrase (e.g., "Reading file") if in_progress, else same as content.
    parameters:
      todos:
        type: array
        description: "List of todo items. Each item must have 'content', 'status', and 'activeForm'."
        required: true

  TodoRead:
    name: "TodoRead"
    description: "Read the current todo list to check progress."
    parameters: {}

  Confirm:
    name: "Confirm"
    description: "Ask the user for confirmation before a critical action."
    parameters:
      message:
        type: string
        description: "The confirmation message/question"
        required: true
      default:
        type: boolean
        description: "Default value (true/false)"
        required: false

  # ==========================================================================
  # SUB-AGENTS
  # ==========================================================================

  Task:
    name: "Task"
    description: |
      Launch a new agent that has access to various tools. When you are searching for a keyword or file and are not confident that you will find the right match on the first try, use the Task tool to perform the search for you. For example:

      - If you are searching for a keyword like "config" or "logger", the Task tool is appropriate
      - If you want to read a specific file path, use the Read or Glob tool instead of the Task tool, to find the match more quickly
      - If you are searching for a specific class definition like "class Foo", use the Glob tool instead, to find the match more quickly

      Usage notes:
      1. Launch multiple agents concurrently whenever possible, to maximize performance; to do that, use a single message with multiple tool uses
      2. When the agent is done, it will return a single message back to you. The result returned by the agent is not visible to the user. To show the user the result, you should send a text message back to the user with a concise summary of the result.
      3. Each agent invocation is stateless. You will not be able to send additional messages to the agent, nor will the agent be able to communicate with you outside of its final report. Therefore, your prompt should contain a highly detailed task description for the agent to perform autonomously and you should specify exactly what information the agent should return back to you in its final and only message to you.
      4. The agent's outputs should generally be trusted
      5. IMPORTANT: The agent can not use Bash, Write, Edit, so can not modify files. If you want to use these tools, use them directly instead of going through the agent.
    parameters:
      prompt:
        type: string
        description: "The task for the agent to perform"
        required: true
      description:
        type: string
        description: "A short (3-5 word) description of the task"
        required: true

  # ==========================================================================
  # WEB OPERATIONS
  # ==========================================================================

  WebSearch:
    name: "WebSearch"
    description: |
      - Allows searching the web and using the results to inform responses
      - Provides up-to-date information for current events and recent data
      - Use this tool for accessing information beyond knowledge cutoff
    parameters:
      query:
        type: string
        description: "The search query to use"
        required: true

  WebFetch:
    name: "WebFetch"
    description: |
      - Fetches content from a specified URL and processes it
      - Takes a URL and a prompt as input
      - Fetches the URL content, converts HTML to markdown
      - Use this tool when you need to retrieve and analyze web content
    parameters:
      url:
        type: string
        description: "The URL to fetch content from"
        required: true
      prompt:
        type: string
        description: "The prompt to run on the fetched content"
        required: true

  # ==========================================================================
  # JUPYTER NOTEBOOKS
  # ==========================================================================

  NotebookRead:
    name: "NotebookRead"
    description: |
      Reads a Jupyter notebook (.ipynb file) and returns all of the cells with their outputs. Jupyter notebooks are interactive documents that combine code, text, and visualizations, commonly used for data analysis and scientific computing. The notebook_path parameter must be an absolute path, not a relative path.
    parameters:
      notebook_path:
        type: string
        description: "The absolute path to the Jupyter notebook file to read"
        required: true

  NotebookEdit:
    name: "NotebookEdit"
    description: |
      Completely replaces the contents of a specific cell in a Jupyter notebook (.ipynb file) with new source. Jupyter notebooks are interactive documents that combine code, text, and visualizations, commonly used for data analysis and scientific computing. The notebook_path parameter must be an absolute path, not a relative path. The cell_number is 0-indexed. Use edit_mode=insert to add a new cell at the index specified by cell_number. Use edit_mode=delete to delete the cell at the index specified by cell_number.
    parameters:
      notebook_path:
        type: string
        description: "The absolute path to the Jupyter notebook file to edit"
        required: true
      cell_number:
        type: integer
        description: "The 0-indexed cell number to edit"
        required: true
      new_source:
        type: string
        description: "The new source for the cell"
        required: true
      edit_mode:
        type: string
        description: "The type of edit to make (replace, insert, delete). Defaults to replace."
        required: false
        enum: ["replace", "insert", "delete"]

# ==========================================================================
# TOOL USAGE POLICY
# ==========================================================================

policy:
  # When doing file search, prefer to use the Task tool in order to reduce context usage.
  # If you intend to call multiple tools and there are no dependencies between the calls, make all of the independent calls in the same function_calls block.

  banned_commands:
    - alias
    - curl
    - curlie
    - wget
    - axel
    - aria2c
    - nc
    - telnet
    - lynx
    - w3m
    - links
    - httpie
    - xh
    - http-prompt
    - chrome
    - firefox
    - safari

  # Commands that should use dedicated tools instead
  prefer_tools_over_bash:
    - find: "Use Glob tool instead"
    - grep: "Use Grep tool instead"
    - cat: "Use Read tool instead"
    - head: "Use Read tool with limit instead"
    - tail: "Use Read tool with offset instead"
    - ls: "Use LS tool instead"
