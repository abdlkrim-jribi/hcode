# Agent Behavior Configuration
# This file contains all agent-specific model parameters and behavior settings

# Temperature settings for different agent modes
temperature:
  default: 0.7          # Default temperature for general operations
  exploration: 1.0      # Higher temperature for creative exploration
  focused: 0.5          # Lower temperature for deterministic tasks
  autonomous: 0.5       # Temperature for autonomous agent decisions
  coding: 0.7           # Temperature for code generation tasks

# Token limits for different thinking modes
max_tokens:
  default: 4096                    # Default maximum tokens
  thinking:
    quick: 1000                    # Quick thinking mode
    medium: 2500                   # Medium thinking mode
    deep: 4000                     # Deep thinking mode
    focused: 800                   # Focused analysis
    comprehensive: 3000            # Comprehensive analysis
  provider_max: 16384              # Maximum output tokens for providers (GPT-4o)

# Agent iteration limits
max_iterations: 50                 # Maximum agent iterations per task

# Agent-specific overrides
# These override the default settings for specific agents
agent_overrides:
  autonomous_agent:
    temperature: 0.5
    max_tokens: 4096
    description: "Lower temperature for more deterministic autonomous decisions"
  
  coding_agent:
    temperature: 0.7
    max_tokens: 16384
    description: "Balanced temperature for code generation with large output capacity"
  
  thinking_manager:
    exploration:
      temperature: 0.7
      max_tokens: 1000
      description: "Moderate exploration with limited output"
    
    exploration_high:
      temperature: 1.0
      max_tokens: 1000
      description: "High creativity for brainstorming"
    
    analysis:
      temperature: 0.7
      max_tokens: 800
      description: "Balanced analysis with focused output"
    
    deep_analysis:
      temperature: 0.7
      max_tokens: 4000
      description: "Deep analysis with comprehensive output"
    
    comprehensive:
      temperature: 0.7
      max_tokens: 3000
      description: "Comprehensive thinking mode"
