# Safety and Security Configuration
# This file contains all safety rules, dangerous commands, and security settings

# Enable/disable sandbox
enable_sandbox: true

# Dangerous commands that should be blocked
# Organized by category for easier management
dangerous_commands:
  filesystem:
    - "rm -rf /"
    - "rm -rf ~"
    - "rm -rf /*"
    - "mv /* /dev/null"
  
  system:
    - ":(){:|:&};:"        # Fork bomb
    - "mkfs"               # Format filesystem
    - "dd if=/dev/zero"    # Overwrite disk
    - "chmod -R 777 /"     # Dangerous permissions
    - "chown -R"           # Recursive ownership change
    - "> /dev/sda"         # Write to disk device
  
  remote_execution:
    - "wget -O- | sh"      # Download and execute
    - "curl | sh"          # Download and execute

# Commands requiring user confirmation before execution
# Organized by category
confirmation_patterns:
  destructive:
    - "rm "
    - "delete"
    - "drop "
    - "truncate"
  
  version_control:
    - "git push --force"
    - "git push -f"
    - "git reset --hard"
    - "git clean -fd"
  
  package_management:
    - "npm publish"
    - "pip install --upgrade"

# Directory restrictions
# Empty list means all directories are allowed (except blocked ones)
allowed_directories: []

# Directories that are always blocked for file operations
blocked_directories:
  - "/"
  - "/etc"
  - "/sys"
  - "/proc"
  - "/dev"

# Additional safety settings
safety_settings:
  # Require confirmation for commands with sudo
  confirm_sudo: true
  
  # Maximum command execution time (seconds)
  max_command_timeout: 300
  
  # Block network access in sandbox (if applicable)
  block_network_in_sandbox: false
  
  # Log all command executions
  log_all_commands: true
