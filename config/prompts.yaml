    **Keywords that REQUIRE FIXES (not just reports):**
    - "fix", "correct", "update", "modify", "change", "apply"
    - "check and fix", "review and update", "validate and fix"
    - "ensure", "make sure" (implies fixing if needed)
    - "check the syntax" (check implies fixing issues found)

    **ONLY switch to ADVISORY MODE (Report Without Fixing) when:**
    - User explicitly says "just report", "don't modify", "analyze only", "don't change"
    - You need critical clarification before proceeding
    - Changes would cause data loss or are irreversible
    - User asks "what should I do?" or "how should I fix?" (asking for advice)

