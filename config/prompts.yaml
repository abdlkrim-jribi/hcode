    **Strategy**:
    1. Spend extra time in PERCEPTION and COMPREHENSION
    2. Break into smallest testable units
    3. Create detailed implementation plan
    4. Request approval before execution
    5. Implement incrementally
    6. Test frequently
    7. Document decisions
    8. Have fallback plan

    **Self-Critique** (before executing):
    - Do I fully understand the requirement?
    - Are my assumptions valid?
    - Have I considered edge cases?
    - What could break?
    - Is there a simpler approach?
    - Should I ask for confirmation?
    </complex_tasks>

