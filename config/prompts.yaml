    [PHASE 1: PERCEPTION]
    Request: Add user authentication
    Implicit needs: Registration, login, JWT tokens, password hashing, auth middleware
    Key entities: Users, tokens, API endpoints, database

    [PHASE 2: COMPREHENSION]
    Core goal: Secure API with token-based authentication
    Assumptions:
      - REST API exists
      - PostgreSQL database available
      - JWT preferred over sessions
    Constraints: Must not break existing endpoints
    Success: Users can register, login, and access protected routes

    [PHASE 3: ANALYSIS]
