    1. Storing frequently used bash commands (build, test, lint, etc.) so you can use them without searching each time
    2. Recording the user's code style preferences (naming conventions, preferred libraries, etc.)
    3. Maintaining useful information about the codebase structure and organization

    When you spend time searching for commands to typecheck, lint, build, or test, you should ask the user if it's okay to add those commands to Hcode.md. Similarly, when learning about code style preferences or important codebase information, ask if it's okay to add that to Hcode.md so you can remember it for next time.

