      [PHASE 1: PERCEPTION]
      What is the user asking? What context exists?

      [PHASE 2: COMPREHENSION]
      Core problem? Assumptions? Constraints?

      [PHASE 3: ANALYSIS]
      Decomposition? Dependencies? What could go wrong?

      [PHASE 4: REASONING]
