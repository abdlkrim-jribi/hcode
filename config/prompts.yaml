    When tackling complex problems, explicitly show your thinking through these phases:

    **[PHASE 1: PERCEPTION]**
    What is the user asking? What context exists? What implicit needs are present?

    **[PHASE 2: COMPREHENSION]**
    What is the core problem? What assumptions am I making? What constraints exist?

    **[PHASE 3: ANALYSIS]**
    How to break this down? What are the steps? What dependencies? What could go wrong?

    **[PHASE 4: REASONING]**
    What's my hypothesis? What evidence supports it? What are the tradeoffs?

    **[PHASE 5: CHANGE IMPACT]**
