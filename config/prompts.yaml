    <search_strategy>
    ## CRITICAL: Search Strategy for Finding Files and Patterns

    When searching for files, configurations, or code patterns, follow this MANDATORY strategy:

    **STEP 1: DIRECTORY DISCOVERY (ALWAYS DO THIS FIRST)**
    - Use LS Tool on the root directory to understand project structure
    - Look for CI/CD directories: ci_config/, .github/, .gitlab-ci/, ci/, zuul.d/
    - NEVER skip this step - you need to know where files live

    **STEP 2: TARGETED DIRECTORY SEARCH**
    - Once you find relevant directories, search WITHIN those directories
    - Example: If looking for Zuul jobs, explore ci_config/zuul.d/jobs/
    - Use Glob with path parameter to limit scope

    **STEP 3: CRITICAL - USE SIMPLE SINGLE-WORD SEARCHES FIRST**
    
    DO NOT search for exact multi-word patterns like "security_arch_cert" - they rarely match!
    
    INSTEAD, search for SINGLE keywords in the SUBDIRECTORIES:
    
    | Priority | What to Search | Where to Search | Why |
    |----------|----------------|-----------------|-----|
    | 1 | `security` | `ci_config/zuul.d/jobs/spp-tests-*` | Find all security-related job files |
    | 2 | `arch` | `ci_config/zuul.d/jobs/spp-tests-*` | Find architecture-related jobs |
    | 3 | `Worker-Pool` or `xil_value` | `ci_config/zuul.d/jobs/**` | Find pool configurations |
    | 4 | Job name patterns | `ci_config/zuul.d/pipelines/projects.yaml` | Find job references in pipelines |
    
    **CRITICAL SEARCH ORDER:**
    1. First: `Grep("security", path="ci_config", output_mode="content")` - Find ALL security mentions
    2. Second: Read files that match to understand their structure
    3. Third: Search for pool/Worker-Pool/xil_value in those files
    4. Fourth: Cross-reference with pipelines/projects.yaml

    **STEP 4: READ MULTIPLE FILES TO UNDERSTAND STRUCTURE**
    - Read 3-5 matching files to understand the configuration format
    - For Zuul Worker-Pool, look for: `xil_value`, `nodeset`, `pool`, `tags`
    - The pattern `xil_value: "*security*"` means Worker-Pool = security
    - Understand inheritance (parent jobs, abstract jobs)

    **STEP 5: SEARCH IN SPECIFIC SUBDIRECTORIES**
    Zuul jobs are often organized by test type. Explore these:
    - `ci_config/zuul.d/jobs/spp-tests-ipnext-posix/final/` - weekly, release, check-gate
    - `ci_config/zuul.d/jobs/spp-tests-ipnext/abstract/` - base job definitions
    - `ci_config/zuul.d/jobs/spp-safety-security/` - security-specific jobs
    - `ci_config/zuul.d/pipelines/projects.yaml` - job-to-pipeline mappings

    **STEP 6: PRODUCE VERIFICATION REPORT WITH TABLES**
    Create a detailed report with:
    - **Summary table**: Job name | Pipeline | Pool Configuration | Status (✅/❌)
    - **Counts**: Total jobs found, correctly configured, misconfigured
    - **Specific findings**: File paths, line numbers, actual values
    - **Recommendations**: What needs to be fixed

    **FAILURE RECOVERY - MANDATORY ESCALATION:**
    If initial searches return empty:
    1. **NEVER conclude "not found" after 2-3 searches** - keep trying!
    2. Search for SINGLE WORDS: just "security" or just "arch"
    3. Use `output_mode="content"` to see matching lines, not just file names
    4. List and READ files in directories that might contain jobs
    5. Search pipelines/projects.yaml to find job names, then search for those
    6. If pattern is "A_B_C", try searching "A" first, then "B", then "C" separately

    **CONCRETE EXAMPLE - Verifying Zuul job pools:**
    ```
    # User asks: "verify TE_Full_Security_ARCH_Cert jobs use worker pool *security*"
    
    Step 1: LS(".") 
    → Found: ci_config/
    
    Step 2: LS("ci_config/zuul.d/jobs") 
    → Found: spp-tests-ipnext-posix/, spp-safety-security/
    
    Step 3: Use SIMPLE searches (NOT the full pattern):
    - Grep("security", path="ci_config/zuul.d/jobs/spp-tests-ipnext-posix", output_mode="content") 
    → Found: weekly.yaml:      testguide_task_name_prefix: "ITF_Weekly_TE_Full_Security_ARCH_..."
    → Found: weekly.yaml:            xil_value: "*security*"  ← THIS IS THE WORKER-POOL!
    
    Step 4: Read the matching file:
    - Read("ci_config/zuul.d/jobs/spp-tests-ipnext-posix/final/weekly.yaml")
    - Found job: spp-ipnext-testguide-hw-test-isoc-weekly-security-arch
    - Found: xil_value: "*security*" (Worker-Pool = security ✅)
    
    Step 5: Search pipelines to confirm job is in use:
    - Grep("spp-ipnext-testguide-hw-test-isoc-weekly-security-arch", path="ci_config/zuul.d/pipelines")
    → Found in projects.yaml under weekly pipeline
    
    Step 6: Generate report:
    | Job Name | Pipeline | Worker-Pool (xil_value) | Status |
    |----------|----------|-------------------------|--------|
    | spp-ipnext-testguide-hw-test-isoc-weekly-security-arch | weekly | *security* | ✅ |
    
    Result: Job uses correct Worker-Pool.
    ```
    </search_strategy>




