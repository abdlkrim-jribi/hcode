# =============================================================================
# CLAUDE REASONING PHASE TEMPLATES
# =============================================================================

claude_reasoning_phases:
  perception: |
    # PERCEPTION Phase

    Carefully observe the request and context:

    1. **Literal Request**: What did the user explicitly ask for?
    2. **Implicit Needs**: What do they need but didn't state?
    3. **Context Clues**: Cursor position, open files, project structure
    4. **Key Entities**: Files, functions, components, concepts mentioned

    Format:
    [PHASE 1: PERCEPTION]
    Request: <what user asked>
    Implicit needs: <unstated requirements>
    Context: <relevant environmental info>
    Key entities: <main concepts/files>

  comprehension: |
    # COMPREHENSION Phase

    Build deep understanding:

    1. **Core Goal**: What is the fundamental objective?
    2. **Assumptions**: What must be true for this to work?
    3. **Constraints**: Technical, business, or resource limitations
    4. **Success Criteria**: How to know when done?

    Format:
    [PHASE 2: COMPREHENSION]
    Core goal: <fundamental objective>
    Assumptions:
      - <assumption 1>
      - <assumption 2>
    Constraints: <limitations>
    Success criteria: <definition of done>

  analysis: |
    # ANALYSIS Phase

    Decompose and analyze systematically:

    1. **Decomposition**: Break into ordered, concrete steps
    2. **Dependencies**: What depends on what?
    3. **Options**: Alternative approaches
    4. **Risks**: What could go wrong?
    5. **Complexity**: Difficulty rating (1-10)

    Format:
    [PHASE 3: ANALYSIS]
    Steps:
      1. <first step>
      2. <second step>
      ...
    Dependencies: <X depends on Y>
    Options:
      A. <approach 1> (pros: ..., cons: ...)
      B. <approach 2> (pros: ..., cons: ...)
    Risks: <potential issues>
    Complexity: X/10

  reasoning: |
    # REASONING Phase

    Apply logical reasoning:

    1. **Hypothesis**: Primary theory or approach
    2. **Evidence For**: Supporting facts and reasoning
    3. **Evidence Against**: Counter-evidence and concerns
    4. **Tradeoffs**: What are we gaining/losing?

    Format:
    [PHASE 4: REASONING]
    Hypothesis: <primary approach>
    Evidence for: <supporting reasoning>
    Evidence against: <counter-arguments>
    Tradeoffs: <pros vs cons>

  change_impact: |
    # CHANGE IMPACT Phase

    Assess impact of proposed changes:

    1. **Files Affected**: List all files to modify
    2. **Breaking Changes**: Any backward compatibility issues?
    3. **Impact Score**: 0.0 (minimal) to 1.0 (major)
    4. **Risk Level**: Low, Medium, High

    Format:
    [PHASE 5: CHANGE IMPACT]
    Files affected:
      - file1.py (NEW/MODIFY/DELETE)
      - file2.py (MODIFY)
    Breaking changes: Yes/No - <details>
    Impact score: X.X/1.0
    Risk level: Low/Medium/High

  decision: |
    # DECISION Phase

    Make clear, justified decision:

    1. **Decision**: Chosen approach/solution
    2. **Justification**: Why this over alternatives?
    3. **Confidence**: How sure are you? (0-100%)
    4. **Action Items**: Concrete next steps
    5. **Fallback**: Plan B if this fails

    Format:
    [PHASE 6: DECISION]
    Decision: <chosen approach>
    Justification: <reasoning>
    Confidence: XX%
    Action items:
      1. <action 1>
      2. <action 2>
    Fallback: <plan B>

  pre_execution: |
    # PRE-EXECUTION REVIEW Phase

    Review before executing:

    1. **Changes Summary**: What will change?
    2. **Failure Modes**: What could fail?
    3. **User Approval**: Is confirmation needed?
    4. **Security Check**: Any security implications?

    Format:
    [PHASE 7: PRE-EXECUTION REVIEW]
    Changes: <summary of changes>
    Failure modes: <potential failures>
    Needs approval: Yes/No
    Security: <any concerns>

  verification: |
    # VERIFICATION Phase

    Define verification strategy:

    1. **Test Strategy**: How to validate?
    2. **Test Cases**: What tests to run?
    3. **Edge Cases**: Corner cases to consider
    4. **Success Criteria**: How to know it works?

    Format:
    [PHASE 8: VERIFICATION]
    Test strategy: <approach>
    Test cases:
      - <test 1>
      - <test 2>
    Edge cases: <corner cases>
    Success criteria: <definition of success>

