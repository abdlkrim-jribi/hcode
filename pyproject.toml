[tool.poetry]
name = "hcode"
version = "0.1.0"
description = "Universal AI Coding Assistant supporting Anthropic Claude and OpenAI GPT"
authors = ["Hcode Team <contact@hcode.dev>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/yourusername/hcode"
repository = "https://github.com/yourusername/hcode"
documentation = "https://github.com/yourusername/hcode#readme"
keywords = ["ai", "coding", "assistant", "claude", "gpt", "openai", "anthropic", "code-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [
    { include = "hcode", from = "src" }
]
include = [
    "README.md",
    "LICENSE",
    "src/hcode/examples/*.example",
    "src/hcode/examples/*.py",
]

[tool.poetry.dependencies]
python = "^3.8"
anthropic = "^0.34.0"
openai = "^1.40.0"
click = "^8.0"
rich = "^13.0"
pyyaml = "^6.0"
python-dotenv = "^1.0"
watchdog = "^4.0"
gitpython = "^3.1"
pathspec = "^0.11"
pygments = "^2.15"
tiktoken = "^0.5"
tenacity = "^8.2"
httpx = "^0.25"
aiofiles = "^23.0"
beautifulsoup4 = "^4.12"
html2text = "^2024.2.26"
lxml = "^5.0"
nbformat = "^5.9"
nbconvert = "^7.16"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23.0"
black = "^24.0"
pylint = "^3.0"
mypy = "^1.0"
isort = "^5.13"
flake8 = "^7.0"

[tool.poetry.group.docker]
optional = true

[tool.poetry.group.docker.dependencies]
docker = "^7.0"

[tool.poetry.scripts]
hcode = "hcode.cli_enhanced:main"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
src_paths = ["src"]
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["src"]

[tool.pylint.messages_control]
max-line-length = 100
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
