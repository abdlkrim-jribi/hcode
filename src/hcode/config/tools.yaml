tools:
  Read:
    name: Read
    description: "Reads a file from the local filesystem."
    parameters:
      file_path:
        type: string
        description: "The absolute path to the file to read"
        required: true
      start_line:
        type: integer
        description: "Start line to view (1-indexed)"
        required: false
      end_line:
        type: integer
        description: "End line to view (1-indexed)"
        required: false

  Write:
    name: Write
    description: "Write a file to the local filesystem."
    parameters:
      file_path:
        type: string
        description: "The absolute path to the file to write"
        required: true
      content:
        type: string
        description: "The content to write"
        required: true

  Edit:
    name: Edit
    description: "Edit a file by replacing specific text."
    parameters:
      file_path:
        type: string
        description: "The absolute path to the file to edit"
        required: true
      old_string:
        type: string
        description: "The exact string to be replaced"
        required: true
      new_string:
        type: string
        description: "The new string to replace it with"
        required: true
      replace_all:
        type: boolean
        description: "Whether to replace all occurrences"
        required: false

  Glob:
    name: Glob
    description: "Find files matching a glob pattern."
    parameters:
      pattern:
        type: string
        description: "The glob pattern to match (e.g., '**/*.py')"
        required: true
      path:
        type: string
        description: "The directory to search in (default: current directory)"
        required: false

  Grep:
    name: Grep
    description: "Search for patterns in files using regex."
    parameters:
      pattern:
        type: string
        description: "The regex pattern to search for"
        required: true
      path:
        type: string
        description: "The file or directory to search in"
        required: true
      glob:
        type: string
        description: "Glob pattern to filter files (e.g., '*.py')"
        required: false
      output_mode:
        type: string
        description: "Output mode (files_with_matches, content, count)"
        required: false

  LS:
    name: LS
    description: "List files in a directory."
    parameters:
      path:
        type: string
        description: "The directory path to list"
        required: true
      ignore:
        type: string
        description: "Comma-separated glob patterns to ignore"
        required: false

  Bash:
    name: Bash
    description: "Execute a bash command."
    parameters:
      command:
        type: string
        description: "The command to execute"
        required: true
      timeout:
        type: integer
        description: "Timeout in milliseconds"
        required: false
      description:
        type: string
        description: "Description of the command purpose"
        required: false
      run_in_background:
        type: boolean
        description: "Run command in background"
        required: false

policy:
  banned_commands:
    - "rm -rf /"
    - ":(){ :|:& };:"
  prefer_tools_over_bash:
    cat: Read
    grep: Grep
    find: Glob
    ls: LS
