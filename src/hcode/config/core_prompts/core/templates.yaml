# Artifact Templates for PEV Workflow
# These templates define the structure of generated artifacts

task_md:
  # Template for task.md file
  template: |
    # Task

    {task}

    ## Understanding

    [Agent's understanding of what needs to be done]

    ## Context

    [Relevant information about the codebase, existing files, etc.]

    ## Subtasks

    - [ ] Subtask 1
    - [ ] Subtask 2
    - [ ] Subtask 3

    ## Questions/Clarifications

    [Any questions or clarifications needed]

implementation_plan_md:
  # Template for implementation_plan.md file
  template: |
    # Implementation Plan

    ## Approach

    [High-level approach and strategy]

    ## Steps

    1. **Step 1**: [Description]
       - File: `path/to/file.py`
       - Action: [What to do]

    2. **Step 2**: [Description]
       - File: `path/to/file.py`
       - Action: [What to do]

    3. **Step 3**: [Description]
       - Action: [What to do]

    ## Files to Modify

    - `file1.py`: [What changes to make]
    - `file2.py`: [What changes to make]

    ## Files to Create

    - `new_file.py`: [What it should contain]

    ## Testing Strategy

    [How to verify the implementation works]

    - Run tests: `pytest tests/`
    - Manual verification: [Steps]

    ## Potential Issues

    [Any potential challenges or considerations]

walkthrough_md:
  # Template for walkthrough.md file
  template: |
    # Implementation Walkthrough

    ## Task

    {task}

    ## What Was Implemented

    [Summary of changes made]

    ## Files Modified

    {modified_files_section}

    ## Changes Details

    {changes_details}

    ## Test Results

    {test_section}

    ## How to Verify

    To verify the implementation works:

    1. Review the modified files listed above
    2. Run tests: `pytest tests/` (or appropriate test command)
    3. Manual verification steps:
       - [Step 1]
       - [Step 2]

    ## Known Limitations

    [Any known issues or limitations]

    ## Next Steps

    [Optional: Suggestions for follow-up work]

progress_update:
  # Template for progress update section in task.md
  template: |

    ## Progress Update

    - Modified files: {modified_files_count}
    - Completed actions: {completed_actions_count}
    - Iteration: {iteration}
